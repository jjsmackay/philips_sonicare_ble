esphome:
  name: atom-lite
  friendly_name: "Atom Lite BLE Bridge"
  # Required: bluedroid_null_fix.py patches ESP-IDF 5.5's bluedroid GATT
  # cache code to add the NULL pointer checks from upstream commit d4f3517.
  # Without it, ``CONFIG_BT_GATTC_CACHE_NVS_FLASH=y`` (which we set below
  # to skip the 4s SDP on reconnect) crashes the ESP inside
  # bta_gattc_cache_save with a LoadProhibited fault. Also covers the
  # same NULL deref hit when running bluetooth_proxy alongside the bridge.
  # Place the script next to this YAML in your ESPHome config dir.
  platformio_options:
    extra_scripts:
      - pre:/config/esphome/bluedroid_null_fix.py

# ESP-IDF is required (not Arduino) because Bluedroid's notification limit
# is only configurable via sdkconfig.  Arduino uses precompiled libbt.a with
# BTA_GATTC_NOTIF_REG_MAX=5 — Sonicare needs 11 subscriptions.
esp32:
  board: m5stack-atom
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_GATTC_MAX_CACHE_CHAR: "80"    # default 40; Sonicare has ~45 attributes
      CONFIG_BT_GATTC_NOTIF_REG_MAX: "20"     # default 5; we subscribe to 11 chars
      # Persist discovered GATT DB to NVS keyed by bonded peer identity.
      # First connect still does a full ~4s SDP; subsequent reconnects to
      # the same brush hit the cache in tens of ms. Requires the
      # bluedroid_null_fix.py pre-script above to dodge an ESP-IDF 5.5 crash
      # inside bta_gattc_cache_save.
      CONFIG_BT_GATTC_CACHE_NVS_FLASH: "y"

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_encryption_key
  custom_services: true
  homeassistant_services: true

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Atom-Lite-Fallback"
    password: !secret fallback_password

captive_portal:

# --- BLE ---

esp32_ble:
  io_capability: none
  max_notifications: 20

esp32_ble_tracker:
  scan_parameters:
    active: true
    interval: 211ms
    window: 120ms

# --- Philips Sonicare Component (Auto-Discovery — no MAC required) ---
#
# The component scans for the Sonicare service UUID, bonds with the brush
# you put into pair-mode via the HA setup flow, and stores the bond identity
# in NVS.  After bonding, the controller resolves rotating BLE addresses
# (RPA) back to the same brush automatically — no MAC pinning needed.
#
# To pair:
#   1. Flash this firmware
#   2. In Home Assistant, add the Philips Sonicare integration → ESP32 Bridge
#   3. Walk through "Pair toothbrush with bridge" — switch on the brush when
#      prompted, the ESP scans, bonds, and finishes setup.
#
# BLE bonding is handled automatically. Models that require bonding (e.g.
# Prestige 9900, ExpertClean, HX991M) are paired via SMP after service
# discovery; models with open GATT (e.g. DiamondClean) work without pairing.

external_components:
  - source:
      type: git
      url: https://github.com/mtheli/philips_sonicare_ble
      ref: master
      path: esphome/components
    components: [philips_sonicare]
    refresh: 0s

philips_sonicare:
  - id: philips_sonicare_ble
    on_connect:
      then:
        - logger.log: "Connected to Sonicare"
        - light.turn_on:
            id: status_led
            red: 0%
            green: 100%
            blue: 0%
    on_disconnect:
      then:
        - logger.log: "Disconnected from Sonicare"
        - light.turn_on:
            id: status_led
            red: 100%
            green: 0%
            blue: 0%

# --- Hardware: M5Stack Atom Lite ---

# NeoPixel LED (GPIO27) — esp32_rmt_led_strip required for ESP-IDF
light:
  - platform: esp32_rmt_led_strip
    chipset: ws2812
    rgb_order: GRB
    pin: GPIO27
    num_leds: 1
    id: status_led
    name: "Status LED"
    restore_mode: ALWAYS_OFF

# Button (GPIO39)
binary_sensor:
  - platform: gpio
    id: atom_button
    name: "Button"
    pin:
      number: GPIO39
      inverted: true

# --- Bluetooth Proxy (optional) ---
# The bluedroid_null_fix.py patch wired up at the top of this file already
# covers the NULL-pointer crash that affected bluetooth_proxy coexistence
# (https://github.com/esphome/esphome/issues/15783) — same patch we use to
# make CONFIG_BT_GATTC_CACHE_NVS_FLASH safe. So uncommenting the block
# below is now a one-liner.
#
# bluetooth_proxy:
#   active: true
